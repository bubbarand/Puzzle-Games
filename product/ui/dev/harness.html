<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game dev harness</title>
<style>
  body { margin: 0; background: #888; font: 14px system-ui; }
  #frame { width: 390px; margin: 0 auto; background: #fff; min-height: 100vh; }
  #bar { padding: 8px 12px; background: #222; color: #fff; display: flex; gap: 10px; align-items: center; }
  #bar button { min-height: 44px; }
  #root { width: 100%; min-height: 560px; position: relative; overflow: hidden; }
</style>
<div id="frame">
  <div id="bar"><button id="undo">Undo</button><button id="reset">Reset</button><span id="hud"></span></div>
  <div id="root"></div>
</div>
<script type="module">
  // Dev harness: ?game=traffic-jam&level=1 . Mimics the shell (spec 003). Not used by the real app.
  const q = new URLSearchParams(location.search);
  const id = q.get('game'), level = +(q.get('level') || 1);
  const mod = await import(`../${id}.js`);
  const style = document.createElement('style'); style.textContent = mod.css; document.head.append(style);
  const log = [];
  window.__log = log;
  const ctx = {
    level,
    reduceMotion: matchMedia('(prefers-reduced-motion: reduce)').matches,
    hud: (h) => { document.getElementById('hud').textContent = JSON.stringify(h); log.push(['hud', h]); },
    solved: (r) => { document.getElementById('hud').textContent += ' SOLVED ' + JSON.stringify(r); log.push(['solved', r]); },
    sound: { move: (i) => log.push(['move', i]), win: () => log.push(['win']) },
  };
  const g = mod.mount(document.getElementById('root'), ctx);
  window.__game = g;
  document.getElementById('undo').onclick = () => g.undo();
  document.getElementById('reset').onclick = () => g.reset();
</script>
